services:
  postgres:
    image: postgres:16-alpine
    container_name: boxfit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: boxfitdb
      POSTGRES_USER: boxfit
      POSTGRES_PASSWORD: boxfit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boxfit -d boxfitdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
