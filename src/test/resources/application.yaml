spring:
  datasource:
    url: jdbc:h2:mem:boxfit-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false

app:
  jwt:
    secret: "test-secret-test-secret-test-secret-123456"
    expiration-ms: 3600000
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    full-name: ${ADMIN_FULL_NAME:Administrator}
    phone-number: ${ADMIN_PHONE_NUMBER:}
  upload:
    max-image-size-bytes: 5242880

aws:
  s3:
    bucket-name: test-bucket
    region: ap-southeast-1
    access-key: test-access-key
    secret-key: test-secret-key
