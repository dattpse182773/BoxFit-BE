spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:boxfitdb}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true


app:
  jwt:
    secret: ${JWT_SECRET:changeit-changeit-changeit-changeit-123456}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    full-name: ${ADMIN_FULL_NAME:Administrator}
    phone-number: ${ADMIN_PHONE_NUMBER:}
  upload:
    max-image-size-bytes: ${MAX_IMAGE_SIZE_BYTES:5242880}

aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME:}
    region: ${AWS_REGION:ap-southeast-1}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
